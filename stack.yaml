version: 0.2.0
last_reviewed: 2026-06-29
goal: >
  A small, verified AI-native development stack with one recommended choice for
  the common case, so humans and coding agents do not have to compare equivalent
  alternatives before starting work. The stack targets both fast project startup
  and long-running autonomous development and maintenance through AI agents.

current_coverage:
  - typescript_web_app
  - vibe_infra

planned_not_selected_yet:
  - python
  - dotnet
  - backend_only_stacks
  - security_practices
  - autonomous_development_practices

languages:
  typescript:
    status: covered_for_web_apps
    guide: docs/languages/typescript.md
    recommended_for:
      - web_application
    stack:
      - TypeScript strict mode
      - React
      - Next.js
      - Mastra
      - Better Auth
      - Mantine
      - Tailwind CSS v4
      - Ultracite + Oxlint
      - Motion

  python:
    status: planned_not_selected_yet

  dotnet:
    status: planned_not_selected_yet

scenarios:
  web_application:
    status: covered
    guide: docs/web-app.md
    stack:
      language: TypeScript
      ui_runtime: React
      app_framework: Next.js
      agent_features: Mastra
      authentication:
        choice: Better Auth
        hosting: self_hosted_in_app
        database: PostgreSQL
      ui_kit: Mantine
      styling: Tailwind CSS v4
      quality:
        type_checking: TypeScript strict mode
        linting_formatting:
          choice: Ultracite
          provider: Oxlint
      animation: Motion
    not_default:
      radix_ui: Use only when Mantine cannot cover a required primitive.
    boundary: Standalone backend framework is not selected yet.

  vibe_infra:
    status: covered
    guide: docs/vibe-infra.md
    stack:
      deployment:
        choice: Dokploy
        alternative_to: Vercel-style hosted deployment
      database:
        choice: PostgreSQL
        alternative_to: Supabase-style managed Postgres platform
      error_tracking:
        choice: Bugsink
        alternative_to: Sentry
        compatible_with:
          - Sentry SDKs
      observability:
        choice: SigNoz
        alternative_to: Grafana-style observability stack
        based_on: OpenTelemetry

sources:
  react: https://react.dev/
  nextjs: https://nextjs.org/docs
  mantine: https://mantine.dev/
  tailwind_css: https://tailwindcss.com/docs
  radix_ui: https://www.radix-ui.com/primitives
  motion: https://motion.dev/
  ultracite: https://www.ultracite.ai/
  oxlint: https://oxc.rs/docs/guide/usage/linter.html
  mastra: https://mastra.ai/
  better_auth: https://www.better-auth.com/docs
  postgresql: https://www.postgresql.org/docs/
  dokploy: https://dokploy.com/
  bugsink: https://github.com/bugsink/bugsink
  signoz: https://signoz.io/docs/
  opentelemetry: https://opentelemetry.io/docs/

comparison_targets:
  vercel: https://vercel.com/docs
  supabase: https://supabase.com/docs
  sentry: https://docs.sentry.io/
  grafana: https://grafana.com/docs/
